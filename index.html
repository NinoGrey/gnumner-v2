<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gnumner 2.0</title>
  
  <!-- Зеленый фавикон -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='8' height='4' x='8' y='2' rx='1' ry='1'/><path d='M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2'/><path d='M12 11h4'/><path d='M12 16h4'/><path d='M8 11h.01'/><path d='M8 16h.01'/></svg>" type="image/svg+xml">

  <!-- Подключение шрифта Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Библиотека минималистичных иконок Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Supabase JS Client и SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <header>
    <div style="display: flex; align-items: center; gap: 12px;">
      <i data-lucide="clipboard-list" style="color: var(--primary); width: 28px; height: 28px;"></i>
      <h1>Gnumner 2.0</h1>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-excel" onclick="exportToExcel()">
        <i data-lucide="file-spreadsheet" class="icon-sm"></i>
      </button>
      <button class="btn" id="updateBtn" onclick="triggerParsing()">
        <i data-lucide="refresh-cw" class="icon-sm"></i>
      </button>
    </div>
  </header>

  <span id="statusLog">Загрузка данных...</span>

  <div class="controls">
    <div class="controls-top">
      <!-- Вкладки дат с кнопкой Позавчера -->
      <div class="tabs">
        <button class="tab" id="tabToday" onclick="setDateFilter('today')">Сегодня</button>
        <button class="tab" id="tabYesterday" onclick="setDateFilter('yesterday')">Вчера</button>
        <button class="tab" id="tabDayBefore" onclick="setDateFilter('dayBefore')">Позавчера</button>
        <button class="tab active" id="tabAll" onclick="setDateFilter('all')">Все даты</button>
      </div>

      <input type="date" id="customDate" class="custom-date-picker" onchange="setDateFilter('custom')">

      <!-- Кастомный выпадающий список фильтра статусов -->
      <div class="select-wrapper">
        <select id="statusFilter" class="custom-select" onchange="applyFilters()">
          <option value="all">Все статусы</option>
          <option value="target">Целевые</option>
          <option value="ignore">Нецелевые</option>
          <option value="unprocessed">На рассмотрении</option>
        </select>
        <i data-lucide="chevron-down" class="select-icon"></i>
      </div>
    </div>

    <div class="controls-bottom">
      <div style="position: relative; width: 100%;">
        <i data-lucide="search" style="position: absolute; left: 12px; top: 10px; color: var(--muted); width: 18px;"></i>
        <input type="text" id="searchInput" placeholder="Поиск по названию или категории..." oninput="applyFilters()" style="padding-left: 38px;">
      </div>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th onclick="sortData('publish_date')">
            <div class="th-content">Публикация <i data-lucide="arrow-up-down" class="sort-icon"></i></div>
          </th>
          <th onclick="sortData('deadline_date')">
            <div class="th-content">Дедлайн <i data-lucide="arrow-up-down" class="sort-icon"></i></div>
          </th>
          <th class="th-dropdown-container">
            <span onclick="toggleCategoryDropdown(event)" style="cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
              Категория <i data-lucide="chevron-down" class="sort-icon"></i>
            </span>
            <div id="categoryDropdown" class="category-dropdown-content" onclick="event.stopPropagation()">
              <div class="dropdown-actions">
                <span onclick="selectAllCategories(true)" class="dropdown-link">Выбрать все</span>
                <span onclick="selectAllCategories(false)" class="dropdown-link">Сбросить</span>
              </div>
              <div id="categoryCheckboxesList"></div>
            </div>
          </th>
          <th onclick="sortData('title')">
            <div class="th-content">Наименование <i data-lucide="arrow-up-down" class="sort-icon"></i></div>
          </th>
          <th>Статус</th>
          <th>Ссылка</th>
        </tr>
      </thead>
      <tbody id="tendersBody">
        <tr><td colspan="6" style="text-align:center; padding: 30px; color: var(--muted);">Инициализация...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
