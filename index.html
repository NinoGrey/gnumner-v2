<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг Тендеров Gnumner</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS для экспорта в Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1300px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }

    .btn {
      background: var(--primary); color: #fff; border: none; padding: 10px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-excel { background: var(--success); }
    .btn-excel:hover { background: #059669; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Панель фильтров */
    .controls { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .tabs { display: flex; background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
    .tab { padding: 6px 14px; border: none; background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.85rem; }
    .tab.active { background: var(--primary); color: #fff; }

    input, select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; outline: none;
    }
    input[type="text"] { flex-grow: 1; min-width: 200px; }

    /* Лог и статус */
    #statusLog { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; display: block; font-family: monospace; }

    /* Таблица */
    .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    th { background: rgba(0,0,0,0.2); color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    tr:hover { background: rgba(255,255,255,0.02); }

    .status-select { font-size: 0.8rem; padding: 4px 8px; }
    .status-target { border-color: var(--success); color: #34d399; }
    .status-ignore { border-color: var(--danger); color: #f87171; }
    
    a.link { color: #60a5fa; text-decoration: none; }
    a.link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📋 Тендеры Gnumner</h1>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-excel" onclick="exportToExcel()">📊 Скачать Excel</button>
      <button class="btn" id="updateBtn" onclick="triggerParsing()">🔄 Обновить базу</button>
    </div>
  </header>

  <span id="statusLog">Готово к работе.</span>

  <div class="controls">
    <!-- Быстрые вкладки по датам -->
    <div class="tabs">
      <button class="tab active" id="tabToday" onclick="setDateFilter('today')">Сегодня</button>
      <button class="tab" id="tabYesterday" onclick="setDateFilter('yesterday')">Вчера</button>
      <button class="tab" id="tabAll" onclick="setDateFilter('all')">Все даты</button>
    </div>

    <!-- Выбор конкретной даты -->
    <input type="date" id="customDate" onchange="setDateFilter('custom')">

    <!-- Поиск по названию / номерам -->
    <input type="text" id="searchInput" placeholder="Поиск по названию или категории..." oninput="applyFilters()">

    <!-- Фильтр по пользовательскому статусу -->
    <select id="statusFilter" onchange="applyFilters()">
      <option value="all">Все статусы</option>
      <option value="target">🎯 Только целевые</option>
      <option value="ignore">❌ Нецелевые</option>
      <option value="unprocessed">⏳ На рассмотрении</option>
    </select>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Публикация</th>
          <th>Дедлайн</th>
          <th>Категория</th>
          <th>Наименование тендера</th>
          <th>Статус</th>
          <th>Ссылка</th>
        </tr>
      </thead>
      <tbody id="tendersBody">
        <tr><td colspan="6" style="text-align:center; padding: 30px; color: var(--muted);">Загрузка данных из Supabase...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // Конфигурация Supabase
  const SUPABASE_URL = 'https://pkjrjtwlryuuconrpcnx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_QfqhRHEjHYp_xA1nC_y7AQ__4pDx3-F'; // Вставьте ключ sb_publishable_...
  
  const GH_USER = 'NinoGrey';
  const GH_REPO = 'gnumner-v2';
  const WORKFLOW_ID = 'tracker.yml';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  let allTenders = [];
  let currentDateMode = 'all';

  // Инициализация при загрузке
  window.addEventListener('DOMContentLoaded', () => {
    setDateFilter('all'); // гарантирует сброс UI на "Все даты"
    loadTenders();
  });

  // Загрузка данных из Supabase
  async function loadTenders() {
    const log = document.getElementById('statusLog');
    log.innerText = '⏳ Загрузка базы данных...';

    const { data, error } = await supabaseClient
      .from('tenders')
      .select('*')
      .order('publish_date', { ascending: false });

    if (error) {
      log.innerText = '❌ Ошибка загрузки данных из Supabase: ' + error.message;
      return;
    }

    allTenders = data || [];
    log.innerText = `✅ Загружено тендеров из базы: ${allTenders.length}`;
    applyFilters();
  }

  // Настройка фильтров по датам
  function setDateFilter(mode) {
    currentDateMode = mode;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));

    if (mode === 'today') document.getElementById('tabToday').classList.add('active');
    if (mode === 'yesterday') document.getElementById('tabYesterday').classList.add('active');
    if (mode === 'all') document.getElementById('tabAll').classList.add('active');
    if (mode !== 'custom') document.getElementById('customDate').value = '';

    applyFilters();
  }

  // Применение всех фильтров на клиенте
  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const statusVal = document.getElementById('statusFilter').value;
    const customDateVal = document.getElementById('customDate').value;

    const todayStr = new Date().toISOString().split('T')[0];
    
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];

    const filtered = allTenders.filter(item => {
      // 1. Фильтр по дате
      if (currentDateMode === 'today' && item.publish_date !== todayStr) return false;
      if (currentDateMode === 'yesterday' && item.publish_date !== yesterdayStr) return false;
      if (currentDateMode === 'custom' && customDateVal && item.publish_date !== customDateVal) return false;

      // 2. Фильтр по статусу
      if (statusVal !== 'all' && (item.user_status || 'unprocessed') !== statusVal) return false;

      // 3. Поиск по тексту
      if (search) {
        const text = `${item.title} ${item.category || ''}`.toLowerCase();
        if (!text.includes(search)) return false;
      }

      return true;
    });

    renderTable(filtered);
  }

  // Отрисовка таблицы
  function renderTable(data) {
    const tbody = document.getElementById('tendersBody');
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 30px; color: var(--muted);">Записи не найдены</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(item => `
      <tr>
        <td><b>${item.publish_date}</b></td>
        <td>${item.deadline_date || '—'}</td>
        <td><span style="font-size:0.8rem; color: var(--muted);">${item.category || 'Общее'}</span></td>
        <td>${item.title}</td>
        <td>
          <select class="status-select ${item.user_status === 'target' ? 'status-target' : (item.user_status === 'ignore' ? 'status-ignore' : '')}" 
                  onchange="updateStatus('${item.id}', this.value)">
            <option value="unprocessed" ${!item.user_status || item.user_status === 'unprocessed' ? 'selected' : ''}>⏳ Рассмотреть</option>
            <option value="target" ${item.user_status === 'target' ? 'selected' : ''}>🎯 Целевой</option>
            <option value="ignore" ${item.user_status === 'ignore' ? 'selected' : ''}>❌ Нецелевой</option>
          </select>
        </td>
        <td><a href="${item.link}" target="_blank" class="link">Открыть ↗</a></td>
      </tr>
    `).join('');
  }

  // Изменение статуса тендера (Целевой / Нецелевой)
  async function updateStatus(id, newStatus) {
    const { error } = await supabaseClient
      .from('tenders')
      .update({ user_status: newStatus })
      .eq('id', id);

    if (error) {
      alert('Ошибка обновления статуса: ' + error.message);
    } else {
      // Обновляем локально
      const target = allTenders.find(x => x.id === id);
      if (target) target.user_status = newStatus;
      applyFilters();
    }
  }

  // Выгрузка в Excel с учетом фильтров
  function exportToExcel() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const statusVal = document.getElementById('statusFilter').value;
    
    // Берем текущий отфильтрованный датасет
    const rows = allTenders.map(t => ({
      'Дата публикации': t.publish_date,
      'Дата окончания': t.deadline_date || '',
      'Категория': t.category || '',
      'Наименование': t.title,
      'Статус': t.user_status === 'target' ? 'Целевой' : (t.user_status === 'ignore' ? 'Нецелевой' : 'На рассмотрении'),
      'Ссылка': t.link
    }));

    const worksheet = XLSX.utils.json_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Тендеры");
    XLSX.writeFile(workbook, `Tenders_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
  }

  // Запуск парсера через GitHub API
  async function triggerParsing() {
    let token = localStorage.getItem('gh_token');
    if (!token) {
      token = prompt('Введите ваш GitHub PAT token:');
      if (!token) return;
      localStorage.setItem('gh_token', token.trim());
    }

    const btn = document.getElementById('updateBtn');
    const log = document.getElementById('statusLog');
    btn.disabled = true;
    log.innerText = '🚀 Запуск парсера в GitHub Actions...';

    try {
      const res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ ref: 'main' })
      });

      if (!res.ok) throw new Error('Ошибка запуска Actions.');

      log.innerText = '⚙️ Парсер запущен. Проверяем новые тендеры в Supabase каждые 5 секунд...';
      
      // Опрашиваем Supabase каждые 5 сек на предмет обновившихся строк
      let checks = 0;
      const interval = setInterval(async () => {
        checks++;
        await loadTenders();
        if (checks >= 12) { // 1 минута опроса
          clearInterval(interval);
          btn.disabled = false;
          log.innerText = '✅ Синхронизация завершена.';
        }
      }, 5000);

    } catch (err) {
      alert(err.message);
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
