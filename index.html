<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг Тендеров Gnumner</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS для экспорта в Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Подключение CSS файла -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <header>
    <h1>📋 Тендеры Gnumner</h1>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-excel" onclick="exportToExcel()">📊 Скачать Excel</button>
      <button class="btn" id="updateBtn" onclick="triggerParsing()">🔄 Обновить базу</button>
    </div>
  </header>

  <span id="statusLog">Готово к работе.</span>

  <div class="controls">
    <div class="controls-top">
      <!-- Быстрые вкладки по датам -->
      <div class="tabs">
        <button class="tab" id="tabToday" onclick="setDateFilter('today')">Сегодня</button>
        <button class="tab" id="tabYesterday" onclick="setDateFilter('yesterday')">Вчера</button>
        <button class="tab active" id="tabAll" onclick="setDateFilter('all')">Все даты</button>
      </div>

      <!-- Выбор конкретной даты -->
      <input type="date" id="customDate" onchange="setDateFilter('custom')">

      <!-- Фильтр по пользовательскому статусу -->
      <select id="statusFilter" onchange="applyFilters()">
        <option value="all">Все статусы</option>
        <option value="target">🎯 Только целевые</option>
        <option value="ignore">❌ Нецелевые</option>
        <option value="unprocessed">⏳ На рассмотрении</option>
      </select>
    </div>

    <div class="controls-bottom">
      <!-- Поиск по названию / номерам -->
      <input type="text" id="searchInput" placeholder="Поиск по названию или категории..." oninput="applyFilters()">
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th onclick="sortData('publish_date')">Публикация <span id="sort-publish_date" class="sort-icon">↕</span></th>
          <th onclick="sortData('deadline_date')">Дедлайн <span id="sort-deadline_date" class="sort-icon">↕</span></th>
          <th class="th-dropdown-container">
            <span onclick="toggleCategoryDropdown(event)" style="cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
              Категория <span class="sort-icon">▼</span>
            </span>
            <!-- Выпадающий мультифильтр категорий -->
            <div id="categoryDropdown" class="category-dropdown-content" onclick="event.stopPropagation()">
              <div class="dropdown-actions">
                <span onclick="selectAllCategories(true)" class="dropdown-link">Выбрать все</span>
                <span onclick="selectAllCategories(false)" class="dropdown-link">Сбросить</span>
              </div>
              <div id="categoryCheckboxesList">
                <!-- Динамически заполняется скриптом -->
              </div>
            </div>
          </th>
          <th onclick="sortData('title')">Наименование тендера <span id="sort-title" class="sort-icon">↕</span></th>
          <th>Статус</th>
          <th>Ссылка</th>
        </tr>
      </thead>
      <tbody id="tendersBody">
        <tr><td colspan="6" style="text-align:center; padding: 30px; color: var(--muted);">Загрузка данных из Supabase...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Подключение JS файла -->
<script src="script.js"></script>
</body>
</html>
